<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>STONKFLY 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#05070f;overflow:hidden;font-family:"Courier New",ui-monospace,monospace;color:#dfe8ff}
#title{position:fixed;left:24px;top:22px;font-size:28px;letter-spacing:.12em;text-shadow:0 0 12px #6af}
#src{position:fixed;left:26px;top:60px;font-size:12px;color:#7f8db3}
#hud{position:fixed;left:20px;bottom:20px;width:380px;background:rgba(5,10,25,.82);border:1px solid #2a3d6b;padding:10px 12px;box-shadow:0 0 18px rgba(80,140,255,.25)}
#hud .h{display:flex;justify-content:space-between;font-size:12px;color:#9fb3e8;border-left:3px solid #5cf;padding-left:6px}
#hud .big{font-size:30px;margin-top:6px}
#hud .row{display:flex;gap:10px;align-items:flex-end}
#hud .lbl{font-size:11px;color:#8595c0;margin-top:4px}
#raster{width:220px;height:60px;border:1px solid #2a3d6b;background:#020510;image-rendering:pixelated}
#dec{position:fixed;right:24px;top:22px;text-align:right}
#dec .s{font-size:34px;letter-spacing:.1em}
#dec .i{font-size:12px;color:#8595c0;max-width:340px}
.BUY{color:#3dff9a;text-shadow:0 0 10px #3dff9a}.SELL{color:#ff5470;text-shadow:0 0 10px #ff5470}.HOLD{color:#9aa6c8}
#help{position:fixed;right:24px;bottom:20px;font-size:11px;color:#56618a}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="title">STONKFLY</div>
<div id="src">загрузка…</div>
<div id="dec"><div class="s HOLD" id="side">—</div><div class="i" id="info"></div></div>
<div id="hud">
  <div class="h"><span>NEURAL REPLAY</span><span id="clock">0.00 S</span></div>
  <div class="row">
    <div><div class="big" id="rate">—</div><div class="lbl">SPIKES / S</div></div>
    <canvas id="raster" width="220" height="96"></canvas>
  </div>
  <div class="lbl">166700 NEURONS · 96-ROW RASTER (из счётчиков групп)</div>
</div>
<div id="help">мышь: вращать · колесо: зум</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const qs = new URLSearchParams(location.search);
const RUN = qs.get('run') || 'paper';
const BASE = `runs/${RUN}/`;
let DEMO = qs.has('demo');

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a1c);
scene.fog = new THREE.Fog(0x070a1c, 16, 48);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 200);
camera.position.set(-5.2, 4.2, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.4, -0.6); controls.enableDamping = true;
controls.maxDistance = 18; controls.minDistance = 3; controls.maxPolarAngle = 1.5;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

scene.add(new THREE.HemisphereLight(0x5a6cff, 0x0a0a20, .55));
const key = new THREE.DirectionalLight(0x9fb8ff, .9); key.position.set(-4,8,5); key.castShadow = true;
key.shadow.mapSize.set(1024,1024); scene.add(key);
const screenLight = new THREE.PointLight(0x4c8dff, 6, 9, 1.6); screenLight.position.set(2.2,2.2,-1.2); scene.add(screenLight);
const pink = new THREE.PointLight(0xff3fa0, 3, 10, 1.8); pink.position.set(-4,1.2,-3); scene.add(pink);

const flat = (c,o={}) => new THREE.MeshStandardMaterial({color:c, flatShading:true, roughness:.75, ...o});
const glow = c => new THREE.MeshBasicMaterial({color:c});

// ---------- city ----------
function windowTex(){
  const c=document.createElement('canvas'); c.width=64; c.height=128; const g=c.getContext('2d');
  g.fillStyle='#0a0e22'; g.fillRect(0,0,64,128);
  for(let y=4;y<124;y+=8) for(let x=4;x<60;x+=8) if(Math.random()<.35){
    g.fillStyle=['#ff4f9a','#5ad1ff','#ffd06a','#8f7bff'][Math.random()*4|0]; g.globalAlpha=.25+Math.random()*.5; g.fillRect(x,y,4,4);}
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; return t;
}
for(let i=0;i<46;i++){
  const w=1+Math.random()*2.5, h=4+Math.random()*16, d=1+Math.random()*2;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshBasicMaterial({map:windowTex()}));
  const a=-Math.PI*.95+Math.random()*Math.PI*.9, r=24+Math.random()*14;
  m.position.set(Math.cos(a)*r, h/2-3, Math.sin(a)*r); m.lookAt(0,h/2-3,0); scene.add(m);
}
// rain
const RAIN=900, rp=new Float32Array(RAIN*6);
for(let i=0;i<RAIN;i++){const x=(Math.random()-.5)*40,y=Math.random()*20,z=-4-Math.random()*20; rp.set([x,y,z,x-.05,y-.5,z],i*6);}
const rainGeo=new THREE.BufferGeometry(); rainGeo.setAttribute('position',new THREE.BufferAttribute(rp,3));
scene.add(new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0x6a7cff,transparent:true,opacity:.35})));

// ---------- room / desk ----------
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60), flat(0x0b1026)); floor.rotation.x=-Math.PI/2; floor.position.y=-1.6; floor.receiveShadow=true; scene.add(floor);
const desk=new THREE.Group(); scene.add(desk);
const top=new THREE.Mesh(new THREE.BoxGeometry(8,.18,3.6), flat(0x1a2044)); top.position.set(0.8,0,-.6); top.receiveShadow=true; desk.add(top);
[[-3,-2.3],[4.6,-2.3],[-3,1.1],[4.6,1.1]].forEach(([x,z])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.15,1.6,.15),flat(0x111633)); l.position.set(x,-.85,z); desk.add(l);});
const edge=new THREE.Mesh(new THREE.BoxGeometry(8,.03,.03), glow(0x3ff0ff)); edge.position.set(.8,.1,1.21); desk.add(edge);
const edge2=edge.clone(); edge2.material=glow(0x3ff0ff); edge2.position.set(.8,-.09,1.21); desk.add(edge2);

// monitor
const mon=new THREE.Group(); mon.position.set(2.4,1.55,-1.9); mon.rotation.y=-.28; scene.add(mon);
mon.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(3.5,2.1,.12), flat(0x0c0f1e)),{castShadow:true}));
const stand=new THREE.Mesh(new THREE.BoxGeometry(.2,1.4,.2), flat(0x0c0f1e)); stand.position.set(0,-1.2,-.1); mon.add(stand);
const scrC=document.createElement('canvas'); scrC.width=1024; scrC.height=600;
const scrT=new THREE.CanvasTexture(scrC); scrT.colorSpace=THREE.SRGBColorSpace;
const screen=new THREE.Mesh(new THREE.PlaneGeometry(3.34,1.96), new THREE.MeshBasicMaterial({map:scrT})); screen.position.z=.065; mon.add(screen);

// keyboard + mug + speaker
const kb=new THREE.Group(); kb.position.set(1.1,.13,-.2); kb.rotation.y=-.25; scene.add(kb);
kb.add(new THREE.Mesh(new THREE.BoxGeometry(1.8,.08,.6), flat(0x151a33)));
const keys=[]; for(let r=0;r<4;r++) for(let c=0;c<12;c++){const k=new THREE.Mesh(new THREE.BoxGeometry(.11,.05,.1), flat(0x252c52,{emissive:0x000000})); k.position.set(-.75+c*.137,.06,-.2+r*.135); kb.add(k); keys.push(k);}
const mug=new THREE.Mesh(new THREE.CylinderGeometry(.18,.16,.36,10), flat(0x6a3aa0)); mug.position.set(3.4,.27,.2); scene.add(mug);
const spk=new THREE.Group(); spk.position.set(5.2,-.2,.6); spk.rotation.y=-.5; scene.add(spk);
spk.add(new THREE.Mesh(new THREE.BoxGeometry(1.2,2.6,1), flat(0x0d1124)));
const rings=[.55,-.55].map(y=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.36,.035,6,24), glow(0x3ff0ff)); r.position.set(0,y,.52); spk.add(r); return r;});

// ---------- the fly ----------
const fly=new THREE.Group(); fly.position.set(-1.2,.95,-.3); fly.rotation.y=.5; scene.add(fly);
const grey=flat(0x7d8a9e), dark=flat(0x5a647c);
const ico=(r,d=1)=>new THREE.IcosahedronGeometry(r,d);
const abdomen=new THREE.Mesh(ico(.6,1), grey); abdomen.scale.set(1.75,.8,.9); abdomen.position.set(-1.05,.05,0); abdomen.castShadow=true; fly.add(abdomen);
const thorax=new THREE.Mesh(ico(.48,1), grey); thorax.scale.set(1.1,.95,.95); thorax.castShadow=true; fly.add(thorax);
const head=new THREE.Group(); head.position.set(.62,.12,0); fly.add(head);
head.add(Object.assign(new THREE.Mesh(ico(.3,1), grey),{castShadow:true}));
const eyeMat=flat(0xc0182a,{emissive:0x400008, roughness:.4});
const eyes=[.24,-.24].map(z=>{const e=new THREE.Mesh(ico(.24,1), eyeMat); e.scale.set(.9,1.1,.8); e.position.set(.08,.06,z); head.add(e); return e;});
[.08,-.08].forEach(z=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.3,4), dark); a.position.set(.25,.3,z); a.rotation.z=-.6; head.add(a);});
const wingMat=new THREE.MeshStandardMaterial({color:0xcfe0ff, transparent:true, opacity:.38, side:THREE.DoubleSide, roughness:.2, metalness:.3, flatShading:true});
function wingGeo(){const s=new THREE.Shape(); s.moveTo(0,0); s.bezierCurveTo(-.6,.35,-1.9,.45,-2.5,.15); s.bezierCurveTo(-2.2,-.2,-1,-.25,0,0); return new THREE.ShapeGeometry(s);}
const wings=[1,-1].map(sd=>{const piv=new THREE.Group(); piv.position.set(-.1,.42,.18*sd); fly.add(piv);
  const w=new THREE.Mesh(wingGeo(), wingMat); w.rotation.x=-Math.PI/2*sd*.92; piv.add(w);
  const vein=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(-2.3,.12,0)]), new THREE.LineBasicMaterial({color:0x9fb0d0})); vein.rotation.copy(w.rotation); piv.add(vein);
  piv.userData.sd=sd; return piv;});
function leg(x,sd,len,spread){
  const hip=new THREE.Group(); hip.position.set(x,-.2,.2*sd); fly.add(hip);
  const u=new THREE.Mesh(new THREE.CylinderGeometry(.03,.025,len,5), dark); u.position.y=-len/2;
  const upper=new THREE.Group(); upper.rotation.set(sd*-1.0, 0, spread); upper.add(u); hip.add(upper);
  const knee=new THREE.Group(); knee.position.y=-len; upper.add(knee);
  const l=new THREE.Mesh(new THREE.CylinderGeometry(.022,.015,len*1.15,5), dark); l.position.y=-len*.57; knee.add(l);
  knee.rotation.x=sd*1.35; return {hip,upper,knee};
}
const legs=[];
[[.25,-.5],[0,0],[-.25,.45]].forEach(([x,sp])=>[1,-1].forEach(sd=>legs.push(leg(x,sd,.7,sp))));
// front-right leg reaches toward keyboard
const tapper=legs[0];

// ---------- raster / monitor drawing ----------
const rC=document.getElementById('raster'), rG=rC.getContext('2d');
function drawRaster(rates){
  const img=rG.getImageData(1,0,rC.width-1,rC.height); rG.putImageData(img,0,0);
  rG.fillStyle='#020510'; rG.fillRect(rC.width-1,0,1,rC.height);
  const groups=[['#6ab8ff',rates.l],['#6ab8ff',rates.r],['#ffffff',rates.gate],['#8898c0',rates.kc],['#ffcc55',rates.rew],['#c86bff',rates.ave]];
  for(let y=0;y<96;y++){const [col,p]=groups[Math.floor(y/16)]; if(Math.random()<p){rG.fillStyle=col; rG.fillRect(rC.width-1,y,1,1);}}
}
let rows=[], lastLen=-1, replay=null;
const mid=r=>(+r.quote.bid + +r.quote.ask)/2;
function drawScreen(flash){
  const g=scrC.getContext('2d'), W=1024, H=600;
  g.fillStyle='#0a0f1f'; g.fillRect(0,0,W,H);
  g.fillStyle='#10193a'; g.fillRect(0,0,W,56);
  g.fillStyle='#4c8dff'; g.beginPath(); g.arc(34,28,14,0,7); g.fill();
  g.fillStyle='#e8eeff'; g.font='bold 24px monospace'; g.fillText('stonk exchange',60,36);
  const last=rows.at(-1);
  g.font='22px monospace'; g.fillStyle='#9fb3e8'; g.fillText(last?last.product:'BTC-USDC',320,36);
  if(last){g.fillStyle='#e8eeff'; g.fillText(mid(last).toFixed(2),470,36);}
  // chart
  const cx=20,cy=80,cw=680,ch=330; g.strokeStyle='#1c2750'; g.lineWidth=1;
  for(let i=0;i<=6;i++){g.beginPath();g.moveTo(cx,cy+ch*i/6);g.lineTo(cx+cw,cy+ch*i/6);g.stroke();}
  const vis=rows.slice(-60);
  if(vis.length){
    const ps=vis.map(mid); let lo=Math.min(...ps),hi=Math.max(...ps); const sp=Math.max(hi-lo,hi*.0005); lo-=sp*.1; hi+=sp*.1;
    const X=i=>cx+cw*(vis.length<2?.5:i/(vis.length-1)), Y=v=>cy+ch*(1-(v-lo)/(hi-lo)), bw=Math.max(3,cw/vis.length*.6);
    ps.forEach((p,i)=>{const o=i?ps[i-1]:p, up=p>=o; g.fillStyle=up?'#26d98a':'#ff4d6d';
      const y1=Y(Math.max(o,p)), y2=Y(Math.min(o,p)); g.fillRect(X(i)-bw/2,y1,bw,Math.max(2,y2-y1));
      g.fillRect(X(i)-1,y1-6,2,y2-y1+12);});
    vis.forEach((r,i)=>{const s=r.neural.side; if(s==='HOLD')return; const x=X(i),y=Y(ps[i]),b=s==='BUY';
      g.fillStyle=b?'#3dff9a':'#ff5470'; g.strokeStyle=g.fillStyle; g.lineWidth=2; g.beginPath();
      if(b){g.moveTo(x,y+14);g.lineTo(x-9,y+30);g.lineTo(x+9,y+30);}else{g.moveTo(x,y-14);g.lineTo(x-9,y-30);g.lineTo(x+9,y-30);}
      g.closePath(); r.execution.status==='FILLED'?g.fill():g.stroke();});
    // equity strip
    const es=vis.map(r=>+r.equity_usdc); let el=Math.min(...es),eh=Math.max(...es); if(eh-el<.05){el-=.03;eh+=.03}
    g.strokeStyle='#ffd06a'; g.lineWidth=2; g.beginPath();
    es.forEach((e,i)=>{const y=440+120*(1-(e-el)/(eh-el)); i?g.lineTo(X(i),y):g.moveTo(X(i),y)}); g.stroke();
    vis.forEach((r,i)=>{const k=r.neural.stimulus; if(k==='none')return; g.fillStyle=k==='reward'?'rgba(255,208,106,.25)':'rgba(200,107,255,.25)'; g.fillRect(X(i)-bw/2,440,bw,120);});
    g.fillStyle='#9fb3e8'; g.font='18px monospace'; g.fillText('equity '+(+last.equity_usdc).toFixed(2)+' USDC',cx,590);
  }
  // order book
  g.fillStyle='#0e1530'; g.fillRect(720,70,290,380);
  if(last){const b=+last.quote.bid,a=+last.quote.ask; g.font='16px monospace';
    for(let i=0;i<8;i++){g.fillStyle='#ff4d6d'; g.fillText((a+(8-i)*2.5).toFixed(2),735,100+i*22); g.fillStyle='#3b4670'; g.fillRect(880,88+i*22,40+((i*37)%80),14);}
    g.fillStyle='#e8eeff'; g.font='bold 20px monospace'; g.fillText(mid(last).toFixed(2),735,290);
    g.font='16px monospace';
    for(let i=0;i<7;i++){g.fillStyle='#26d98a'; g.fillText((b-i*2.5).toFixed(2),735,318+i*20); g.fillStyle='#3b4670'; g.fillRect(880,306+i*20,40+((i*53)%80),14);}}
  // big button
  const s=last?last.neural.side:'HOLD', col={BUY:'#1fcf7a',SELL:'#ff4d6d',HOLD:'#3553b8'}[s];
  g.fillStyle=flash?'#ffffff':col; g.fillRect(720,470,290,90);
  g.fillStyle=flash?col:'#ffffff'; g.font='bold 40px monospace'; g.textAlign='center'; g.fillText(s,865,528); g.textAlign='left';
  scrT.needsUpdate=true;
}

// ---------- data ----------
function fakeRow(i,prev){
  const p=prev?mid(prev)+(Math.random()-.5)*60:64000, s=['BUY','HOLD','HOLD','SELL','HOLD'][Math.random()*5|0];
  const e=prev?+prev.equity_usdc+(Math.random()-.5)*.08:100, k=['none','reward','aversive'][Math.random()*3|0];
  return {tick:i,wall_time:Date.now()/1000,product:'BTC-USDC',quote:{bid:String(p),ask:String(p+1)},equity_usdc:String(e),
    neural:{side:s,left_hz:Math.random()*20,right_hz:Math.random()*20,difference_hz:(Math.random()-.5)*10,gate_spikes:Math.random()*8|0,
      KC_spikes:200+Math.random()*600|0,reward_spikes:k==='reward'?40+Math.random()*60|0:Math.random()*4|0,aversive_spikes:k==='aversive'?10+Math.random()*20|0:0,
      total_spikes:300000+Math.random()*200000|0,stimulus:k,memory:{changed_edges:Math.random()*3000|0}},
    execution:{status:s==='HOLD'?'HOLD':(Math.random()<.7?'FILLED':'VETO')}};
}
async function poll(){
  if(!DEMO){
    try{
      const res=await fetch(BASE+'events.jsonl?t='+Date.now(),{cache:'no-store'}); if(!res.ok) throw 0;
      const lines=(await res.text()).trim().split('\n').filter(Boolean);
      if(lines.length!==lastLen){rows=lines.map(l=>JSON.parse(l)); const isNew=lastLen>=0||true; lastLen=lines.length; if(isNew&&rows.length) startReplay(rows.at(-1));}
      let halt=''; try{const er=await fetch(BASE+'error.json?t='+Date.now(),{cache:'no-store'}); if(er.ok){const j=await er.json(); halt=' · ОСТАНОВЛЕНО: '+j.reason;}}catch{}
      const age=rows.length?Math.round(Date.now()/1000-rows.at(-1).wall_time):0;
      document.getElementById('src').textContent=`прогон «${RUN}» · ${rows.length} тиков · последний ${age} с назад${halt}`;
      return;
    }catch{ DEMO=true; }
  }
  const r=fakeRow(rows.length, rows.at(-1)); rows.push(r); if(rows.length>200) rows.shift(); startReplay(r);
  document.getElementById('src').textContent='ДЕМО-режим: нет runs/'+RUN+'/events.jsonl (запусти сервер из ~/stonkfly)';
}

function startReplay(r){
  const n=r.neural;
  replay={r,t0:performance.now(),dur:3200,
    rates:{l:Math.min(.9,n.left_hz/25),r:Math.min(.9,n.right_hz/25),gate:Math.min(.9,n.gate_spikes/8),kc:Math.min(.6,n.KC_spikes/1500),rew:Math.min(.9,n.reward_spikes/80),ave:Math.min(.9,n.aversive_spikes/30)}};
  const side=document.getElementById('side'); side.textContent={BUY:'BUY',SELL:'SELL',HOLD:'HOLD'}[n.side]; side.className='s '+n.side;
  document.getElementById('info').innerHTML=`тик ${r.tick} · ${r.execution.status}${r.execution.reason?' ('+r.execution.reason+')':''}<br>`+
    `DNp20 L ${(+n.left_hz).toFixed(1)} Гц / R ${(+n.right_hz).toFixed(1)} Гц · стимул: ${n.stimulus}<br>синапсов изменено: ${n.memory?.changed_edges??0} · баланс ${(+r.equity_usdc).toFixed(2)}`;
  document.getElementById('rate').textContent=(n.total_spikes/0.5/1000).toFixed(1)+'K';
  drawScreen(false);
}

// ---------- animation ----------
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime(), now=performance.now();
  // rain
  const pos=rainGeo.attributes.position.array;
  for(let i=0;i<RAIN;i++){let y=pos[i*6+1]-.25; if(y<-2) y+=20; pos[i*6+1]=y; pos[i*6+4]=y-.5;}
  rainGeo.attributes.position.needsUpdate=true;
  // idle fly
  let buzz=.04, tap=0, shiver=0, eyeGlow=0;
  if(replay){
    const k=(now-replay.t0)/replay.dur, r=replay.r, n=r.neural;
    if(k<1){
      document.getElementById('clock').textContent=(k*0.5).toFixed(2)+' S';
      drawRaster(replay.rates);
      if(n.stimulus==='reward'){buzz=.5*Math.sin(k*Math.PI); eyeGlow=.6*Math.sin(k*Math.PI);}
      if(n.stimulus==='aversive') shiver=.06*Math.sin(k*Math.PI);
      if(n.side!=='HOLD' && k>.45 && k<.9){tap=Math.sin((k-.45)/.45*Math.PI);
        if(k>.6 && !replay.pressed){replay.pressed=true; drawScreen(true); setTimeout(()=>drawScreen(false),260);
          const kk=keys[(Math.random()*keys.length)|0]; kk.material=kk.material.clone(); kk.material.emissive.set(n.side==='BUY'?0x1fcf7a:0xff4d6d); setTimeout(()=>kk.material.emissive.set(0),500);}}
    } else {drawRaster({l:.01,r:.01,gate:0,kc:.01,rew:0,ave:0});}
  }
  wings.forEach(w=>{w.rotation.x=w.userData.sd*(.08+Math.sin(t*60)*buzz); w.rotation.z=.12+Math.sin(t*1.3)*.03;});
  fly.position.y=.95+Math.sin(t*1.7)*.02; fly.rotation.z=Math.sin(t*50)*shiver;
  head.rotation.y=Math.sin(t*.7)*.15; head.rotation.z=-.1+Math.sin(t*1.1)*.05;
  eyeMat.emissive.setRGB(.25+eyeGlow,.02,.03);
  legs.forEach((l,i)=>{l.knee.rotation.z=Math.sin(t*2+i)*.04;});
  tapper.upper.rotation.z=-.5 - tap*.9; tapper.knee.rotation.x=1.35 - tap*.9;
  rings.forEach((r,i)=>r.scale.setScalar(1+Math.sin(t*6+i)*.04*(1+buzz*6)));
  screenLight.intensity=5+Math.sin(t*3)*.4;
  controls.update(); renderer.render(scene,camera);
}
drawScreen(false); animate(); poll(); setInterval(poll, DEMO?4000:3000);
</script>
